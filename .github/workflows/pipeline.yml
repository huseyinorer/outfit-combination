name: Test, publish and release

on:
  workflow_dispatch:
    inputs:
      rebuild_apk:
        description: Rebuild and replace the APK asset for the current version
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: outfit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-checks:
    name: Mobile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run check:version
      - run: npm run typecheck
      - run: npm test

  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet --version
      - run: dotnet restore api/OutfitCombination.Api.Tests/OutfitCombination.Api.Tests.csproj
      - run: dotnet build api/OutfitCombination.Api.Tests/OutfitCombination.Api.Tests.csproj -c Release --no-restore
      - run: dotnet run --project api/OutfitCombination.Api.Tests/OutfitCombination.Api.Tests.csproj -c Release --no-build

  release-apk:
    name: Build APK when app version changes
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: [mobile-checks, backend-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Check whether this version has a healthy APK release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_apk || false }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./mobile/app-version.json').version")
          TAG="v$VERSION"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/outfit-combination.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          RELEASE_EXISTS=false
          APK_HEALTHY=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
            APK_SIZE=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name == "outfit-combination.apk") | .size' | head -n 1)
            if [[ "$APK_SIZE" =~ ^[0-9]+$ ]] && [ "$APK_SIZE" -gt 10000000 ]; then
              if curl --fail --silent --show-error --location --head \
                --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 \
                "$DOWNLOAD_URL" >/dev/null; then
                APK_HEALTHY=true
              fi
            fi
          fi

          NEEDS_BUILD=true
          if [ "$APK_HEALTHY" = true ] && [ "$FORCE_REBUILD" != true ]; then
            NEEDS_BUILD=false
          fi
          echo "release_exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"
          echo "needs_build=$NEEDS_BUILD" >> "$GITHUB_OUTPUT"
      - name: Install mobile dependencies
        if: steps.release.outputs.needs_build == 'true'
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Regenerate Android native project
        if: steps.release.outputs.needs_build == 'true'
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean
      - name: Decode release keystore
        if: steps.release.outputs.needs_build == 'true'
        working-directory: mobile/android/app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 secret is empty"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          test -s release.keystore
          echo "keystore size: $(stat --format=%s release.keystore) bytes"
          echo "keystore sha256: $(sha256sum release.keystore | cut -d' ' -f1)"
          file release.keystore || true
          keytool -list -v -keystore release.keystore -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | grep -E "Alias name|Certificate fingerprints|SHA1|SHA256" | head -20
      - name: Print Gradle signing report
        if: steps.release.outputs.needs_build == 'true'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:signingReport --no-daemon
      - name: Assemble release APK
        if: steps.release.outputs.needs_build == 'true'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Print APK signer certificate
        if: steps.release.outputs.needs_build == 'true'
        working-directory: mobile/android
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Collect APK
        if: steps.release.outputs.needs_build == 'true'
        run: |
          set -euo pipefail
          cp mobile/android/app/build/outputs/apk/release/app-release.apk outfit-combination.apk
          APK_SIZE=$(stat --format=%s outfit-combination.apk)
          test "$APK_SIZE" -gt 10000000
          sha256sum outfit-combination.apk > outfit-combination.apk.sha256
      - name: Publish GitHub release
        if: steps.release.outputs.needs_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_EXISTS: ${{ steps.release.outputs.release_exists }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_EXISTS" = true ]; then
            gh release upload "v$VERSION" outfit-combination.apk outfit-combination.apk.sha256 --clobber
          else
            gh release create "v$VERSION" outfit-combination.apk outfit-combination.apk.sha256 \
              --title "Outfit Combination v$VERSION" --generate-notes
          fi

          REMOTE_SIZE=$(gh release view "v$VERSION" --json assets --jq '.assets[] | select(.name == "outfit-combination.apk") | .size' | head -n 1)
          APK_SIZE=$(stat --format=%s outfit-combination.apk)
          test "$REMOTE_SIZE" = "$APK_SIZE"
          curl --fail --silent --show-error --location --head \
            --retry 5 --retry-all-errors --connect-timeout 15 --max-time 90 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/outfit-combination.apk" >/dev/null
