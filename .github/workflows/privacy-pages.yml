name: Publish privacy policy

on:
  push:
    branches: [main]
    paths:
      - "privacy-site/**"
      - ".github/workflows/privacy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: privacy-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: privacy-site
      - name: Deploy privacy policy
        id: deployment
        uses: actions/deploy-pages@v4
